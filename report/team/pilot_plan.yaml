# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a) · Nhóm RICONs, L3B
# Điền mọi chỗ có dấu hỏi. Khi nộp, ngoài các dòng chú thích không còn dấu hỏi nào.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
# Mọi số dưới đây do src/lab13.py tính (mục D1, D3, E1).
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu: co_mau(0,70; 0,75) = 1.251 yêu cầu mỗi nhóm (z chính xác; statsmodels arcsine cho 1.250).
#   b) Theo nhân viên, m = 75: DE = 1 + 74 × 0,02 = 2,48; n = 1.251 × 2,48 = 3.103 mỗi nhóm
#      → 3.103 / 75 = 42 nhân viên mỗi nhóm, tổng 84 > 40 nhân viên: KHÔNG đủ người.
#   c) 20 nhân viên mỗi nhóm: cỡ mẫu hiệu dụng luôn < c / ICC = 20 / 0,02 = 1.000 < 1.251: KHÔNG đạt mức 5 điểm.
#   d) 6 depot mỗi nhóm: cỡ mẫu hiệu dụng luôn < 6 / 0,02 = 300 (và chỉ 6 cụm, dưới 20): loại.
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 nhân viên mỗi nhóm: 20m / (1 + (m − 1) × 0,02) ≥ 859
#      → 2,82m ≥ 841,82 → m ≥ 299 yêu cầu mỗi nhân viên (DE = 6,96; n hiệu dụng = 859,2).
#      Khả thi: phạm vi noi_dia + hang_nang = 81,8% yêu cầu ≈ 42 yêu cầu/nhân viên/ngày làm việc → 299 yêu cầu ≈ 7 ngày làm việc.
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (theo nhân viên, 20 + 20):
#   1. Đối chứng chạy cùng thời gian: có, 20 nhân viên đối chứng làm cùng tuần, cùng 12 depot, cùng phạm vi loại yêu cầu.
#   2. Chia ngẫu nhiên hay do người chọn: ngẫu nhiên, bốc thăm bằng code với seed 13 ghi trước, phân tầng theo depot.
#   3. Ảnh hưởng gián tiếp và cách giảm: có rủi ro nhân viên đối chứng xem câu trả lời của đồng nghiệp cùng depot;
#      giảm bằng quyền truy cập trợ lý theo tài khoản, log lượt mở trợ lý theo staff_id, nhân viên đối chứng mở trợ lý được tính là vi phạm.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: có, chốt trong file này trước ngày bắt đầu 2026-12-07, không đổi khi đang chạy.
#   5. Ít nhất 20 cụm mỗi nhóm: có, đúng 20 cụm (nhân viên) mỗi nhóm.
#
# Đánh đổi đã chấp nhận (nếu cách chia chưa đạt cả hai điều kiện):
#   Với 40 nhân viên, không cách chia theo cụm nào đủ mẫu để thấy mức chênh 5 điểm (tối đa 1.000 < 1.251).
#   Nhóm chọn chia theo nhân viên 20 + 20 (tách được tác động) và hạ mức chênh phát hiện được xuống 6 điểm (mde 0,06).
#   Con số bất lợi: nếu tác động thật chỉ 5 điểm thì power còn ≈ 0,64 (statsmodels NormalIndPower, n = 859).
#   Giám đốc vận hành phải ký chấp nhận đánh đổi này trước ngày bắt đầu. Không chọn chia theo yêu cầu vì cùng một
#   nhân viên vừa dùng vừa không dùng trợ lý, tràn tác động cao.
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn đã chọn:
#   Đợt chạy thử: 4,25% (51/1.200) toàn mẫu; 3,97% (39/982) trong phạm vi noi_dia + hang_nang; 15/20 nhân viên đã trên 3%.
#   Ngưỡng tuyệt đối 3% sẽ dừng pilot ngay tuần đầu → dùng so với đối chứng (nhóm trợ lý cao hơn ≥ 2 điểm) kèm trần tuyệt đối 6%.

